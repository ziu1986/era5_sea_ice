# Example configuration
input:
  dir: '/data/era5_sic'
  files: 'ERA05_T42L90MA_201*.nc'
target:
  output: 'results'
  plots: 'plots'
nc_attributes:
  short_name: 'my sic'
  long_name: 'multi-year sea_ice_cover'
  standard_name: 'multi-year sea_ice_cover'
  units: 'fraction'
  history: "Stefanie Falk (stefanie.falk@kit.edu): Extracted multi-year sea ice cover with commpute_my_sic_from_sic.py from ERA5 SIC"
  cite: "Tschudi, M., W. N. Meier, J. S. Stewart, C. Fowler, and J. Maslanik. 2023. EASE-Grid Sea Ice Age, Version 4.1, [indicate subset used]. Boulder, Colorado USA: NASA National Snow and Ice Data Center Distributed Active Archive Center. https://nsidc.org/data/nsidcc-0611. https://doi.org/10.5067/UTAV7490FEPB [last access date: July 24, 2023]."
  support: "Stefan Kern, ICDC, CEN, University of Hamburg"
